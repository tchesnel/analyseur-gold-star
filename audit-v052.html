<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#06080c;color:#e5edf7;font:13px system-ui}main{padding:14px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px}.card{border:1px solid #1d2735;background:#0b1017;border-radius:14px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid #1d2735;display:flex;justify-content:space-between}.chart{height:820px;position:relative}.chart canvas{display:block}.side{padding:14px}.side h2{font-size:14px;margin:0 0 10px}.item{padding:8px 0;border-bottom:1px solid #1d2735}.item b{display:block;font-size:12px}.focus{border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:12px;background:#101722}.focus strong{display:block;color:#93c5fd}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{border:1px solid #1d2735;padding:8px;border-radius:8px}.m span{font-size:9px;color:#7f8ea3;display:block}.m b{font-size:12px}.on{color:#2dd4bf}.off{color:#64748b}</style></head><body><main><div class="grid"><section class="card"><div class="head"><div><b>XAUUSD — audit v0.5.2 context hierarchy</b><div>AUTO</div></div><div id="quote"></div></div><div id="chart" class="chart"><canvas></canvas></div></section><aside class="card side"><div class="focus"><small>AUTO FOCUS</small><strong id="focus">—</strong><div id="reasons"></div></div><div class="metrics" id="metrics"></div><h2>Familles AUTO</h2><div id="families"></div></aside></div></main>
<script type="module">
import {GoldChart} from './assets/chart.js';import {generateMockHistory} from './api/_lib/mock.js';import {buildVisualAnalysis} from './engine/visual-analysis.js';
const NOW=Date.UTC(2026,8,16,0,40);const bars=generateMockHistory('M5',320,NOW);const p=bars.at(-1).close;const snapshot={bars:{M1:bars,M5:bars,M15:bars,M30:bars,H1:bars,H4:bars},quote:{bid:p,ask:p+.09,spread:.09,timestamp:NOW},depth:{available:true,bidLevels:[{price:p-.12,size:800},{price:p-.22,size:620},{price:p-.32,size:480}],askLevels:[{price:p+.12,size:760},{price:p+.22,size:590},{price:p+.32,size:500}],bidSize:1900,askSize:1850,ratio:1.03,imbalance:.013},macro:{available:true,bias:'gold-negative',risk:'watch',dxy:{value:99.71},us10y:{value:5.00},real10y:{value:2.62},nextEvent:{type:'FOMC',title:'FOMC decision / press conference',time:NOW+18*3600_000,impact:'critical'}}};const v=buildVisualAnalysis(snapshot,'M5');const chart=new GoldChart(document.querySelector('#chart'));chart.setBars(bars);chart.setQuote(snapshot.quote);chart.setOverlays(v.overlays);chart.setFamilies(v.display.families);document.querySelector('#quote').textContent=`BID ${p.toFixed(2)} • ASK ${(p+.09).toFixed(2)}`;document.querySelector('#focus').textContent=v.display.focus;document.querySelector('#reasons').textContent=v.display.reasons.join(' • ');const mm=[['Macro risk',v.metrics.macroRisk],['Macro bias',v.metrics.macroBias],['US 10Y',v.metrics.us10y?.toFixed(2)+'%'],['Real 10Y',v.metrics.real10y?.toFixed(2)+'%'],['DXY',v.metrics.dxy?.toFixed(2)],['ADX',v.metrics.adx14?.toFixed(1)],['DOM quality',v.metrics.depthQuality],['DOM imbalance',((v.metrics.depthImbalance??0)*100).toFixed(1)+'%']];document.querySelector('#metrics').innerHTML=mm.map(([a,b])=>`<div class="m"><span>${a}</span><b>${b??'—'}</b></div>`).join('');document.querySelector('#families').innerHTML=Object.entries(v.display.families).map(([k,on])=>`<div class="item"><b class="${on?'on':'off'}">${on?'✓':'○'} ${k}</b></div>`).join('');window.__AUDIT_READY=true;
</script></body></html>
