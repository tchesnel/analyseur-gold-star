<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#06080c;color:#e5edf7;font:13px system-ui}main{padding:14px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.card{border:1px solid #1d2735;background:#0b1017;border-radius:14px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid #1d2735;display:flex;justify-content:space-between}.chart{height:820px;position:relative}.chart canvas{display:block}.side{padding:14px}.side h2{font-size:14px;margin:0 0 10px}.item{padding:8px 0;border-bottom:1px solid #1d2735}.item b{display:block;font-size:12px}.item small{color:#7f8ea3}.focus{border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:12px;background:#101722}.focus strong{display:block;color:#93c5fd}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{border:1px solid #1d2735;padding:8px;border-radius:8px}.m span{font-size:9px;color:#7f8ea3;display:block}.m b{font-size:12px}.on{color:#2dd4bf}.off{color:#64748b}</style></head><body><main><div class="grid"><section class="card"><div class="head"><div><b>XAUUSD — audit renderer v0.5.0</b><div id="sub">AUTO</div></div><div id="quote"></div></div><div id="chart" class="chart"><canvas></canvas></div></section><aside class="card side"><div class="focus"><small>AUTO FOCUS</small><strong id="focus">—</strong><div id="reasons"></div></div><div class="metrics" id="metrics"></div><h2>Familles</h2><div id="families"></div></aside></div></main>
<script type="module">
import {GoldChart} from './assets/chart.js';import {allFamilies} from './assets/layer-state.js';import {generateMockHistory} from './api/_lib/mock.js';import {buildVisualAnalysis} from './engine/visual-analysis.js';
const NOW=Date.UTC(2026,8,16,0,20);const bars=generateMockHistory('M5',320,NOW);const p=bars.at(-1).close;const snapshot={bars:{M1:bars,M5:bars,M15:bars,M30:bars,H1:bars,H4:bars},quote:{bid:p,ask:p+.09,spread:.09,timestamp:NOW},depth:{available:true,bidLevels:[{price:p-.12,size:980},{price:p-.22,size:500}],askLevels:[{price:p+.12,size:410},{price:p+.22,size:260}],bidSize:1480,askSize:670,ratio:2.21,imbalance:.376,bidWall:{price:p-.12,size:980},askWall:{price:p+.12,size:410}},macro:{available:true,bias:'gold-supportive',risk:'high',dxy:{value:104.10,change:-.25},us10y:{value:4.08,change:-.05},real10y:{value:1.72,change:-.04},nextEvent:{type:'FOMC',title:'FOMC decision',time:NOW+45*60000,impact:'critical'}}};const v=buildVisualAnalysis(snapshot,'M5');const chart=new GoldChart(document.querySelector('#chart'));chart.setBars(bars);chart.setQuote(snapshot.quote);chart.setOverlays(v.overlays);const mode=new URLSearchParams(location.search).get('mode')||'auto';let fam=v.display.families;if(mode==='all')fam=allFamilies(true);if(mode==='profile')fam={...allFamilies(false),volumeProfile:true,avwap:true,htf:true};if(mode==='flow')fam={...allFamilies(false),orderFlow:true,adx:true,structure:true,liquidity:true};if(mode==='regime')fam={...allFamilies(false),volatilityRegime:true,macro:true,rsi:true,atr:true};chart.setFamilies(fam);document.querySelector('#sub').textContent=mode.toUpperCase();document.querySelector('#quote').textContent=`BID ${p.toFixed(2)} • ASK ${(p+.09).toFixed(2)}`;document.querySelector('#focus').textContent=v.display.focus;document.querySelector('#reasons').textContent=v.display.reasons.join(' • ');const mm=[['ADX',v.metrics.adx14?.toFixed(1)],['DOM',`${(v.metrics.depthImbalance*100).toFixed(0)}% BID`],['POC',v.metrics.profilePoc?.toFixed(2)],['VAH',v.metrics.profileVah?.toFixed(2)],['VAL',v.metrics.profileVal?.toFixed(2)],['BBW',`${v.metrics.volatilityState}`],['AVWAP',v.metrics.avwapNearest?.label],['Macro',v.metrics.macroRisk]];document.querySelector('#metrics').innerHTML=mm.map(([a,b])=>`<div class="m"><span>${a}</span><b>${b??'—'}</b></div>`).join('');document.querySelector('#families').innerHTML=Object.entries(fam).map(([k,on])=>`<div class="item"><b class="${on?'on':'off'}">${on?'✓':'○'} ${k}</b></div>`).join('');window.__AUDIT_READY=true;
</script></body></html>
